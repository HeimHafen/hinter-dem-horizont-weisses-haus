<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18231f">
  <meta name="description" content="Hinter dem Horizont – Forschungsbasierte 3D-Architekturstudie der Executive Residence des Weißen Hauses">
  <title>Hinter dem Horizont – Architektur des Weißen Hauses</title>
  <style>
    :root{color-scheme:dark;--ink:#16231f;--white:#f7f2e9;--muted:#ddd4c2;--border:#a6aa95}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#15251f;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    #scene{position:fixed;inset:0;overflow:hidden}#scene canvas{display:block;width:100%;height:100%;touch-action:none}
    header{position:fixed;z-index:2;left:16px;top:max(14px,env(safe-area-inset-top));width:min(390px,calc(100% - 32px));background:#17241fec;backdrop-filter:blur(12px);border:1px solid #a6aa954a;border-radius:18px;padding:14px 16px;box-shadow:0 8px 27px #0004;pointer-events:none}
    h1{font:25px/1.10 Georgia,serif;margin:0 0 7px}header p{font-size:13px;line-height:1.40;color:var(--muted);margin:0}
    #toolbar{position:fixed;left:16px;right:16px;bottom:max(15px,env(safe-area-inset-bottom));z-index:3;display:grid;gap:10px;grid-template-columns:minmax(0,1fr) auto;max-width:640px;margin:auto;background:#17241ff4;backdrop-filter:blur(14px);border:1px solid #a6aa9550;border-radius:16px;padding:11px;box-shadow:0 7px 28px #0005}
    #floor{border-radius:10px;border:1px solid #babfad;background:#26372f;color:var(--white);padding:0 10px;min-width:0;height:48px;font-size:15px}
    #top-view{padding:0 12px;border-radius:10px;border:1px solid #babfad;background:#3b493e;color:var(--white);font-size:14px;height:48px}
    #status{position:fixed;left:16px;right:16px;bottom:calc(max(15px,env(safe-area-inset-bottom)) + 90px);z-index:2;max-width:640px;margin:auto;pointer-events:none;font-size:12px;line-height:1.45;color:#f0eadf;text-shadow:0 1px 5px #0009}
    #error{position:fixed;left:16px;right:16px;top:135px;color:#fce2cf;background:#732a20e9;padding:15px;border-radius:10px;display:none;z-index:4}
    #legend{position:fixed;right:16px;top:max(14px,env(safe-area-inset-top));background:#17241fdc;border:1px solid #a6aa953a;border-radius:12px;padding:10px;font-size:11px;color:#e7e4d7;max-width:166px;z-index:2;text-align:right}
    #info{position:fixed;bottom:calc(max(15px,env(safe-area-inset-bottom)) + 140px);right:16px;background:#19291fcc;border-radius:10px;padding:8px 10px;font-size:12px;z-index:2;max-width:220px;pointer-events:none;color:#efe9db}
    a{color:#e7d8a1}
    @media(max-width:670px){#legend{display:none}header{max-width:calc(100% - 32px)}h1{font-size:22px}header p{font-size:12px}#info{max-width:180px;bottom:calc(max(15px,env(safe-area-inset-bottom)) + 161px)}}
    @media(max-width:390px){#toolbar{grid-template-columns:minmax(0,1fr) auto}#top-view{padding:0 9px;font-size:13px}#status{font-size:11px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
  <div id="scene"></div>
  <header><h1>Hinter dem Horizont</h1><p>Weißes Haus · Architekturstudie A0.1<br>Maßstabsbasis: Executive Residence</p></header>
  <div id="legend">Nur Architektur<br>Öffentliche Räume: schematisch<br>Private Geschosse: nur Hülle</div>
  <div id="info">Ansicht ziehen · Zwei Finger zum Zoomen</div>
  <div id="status" role="status">3D-Modell wird aufgebaut …</div>
  <div id="error" role="alert"></div>
  <div id="toolbar">
    <select id="floor" aria-label="Geschoss auswählen">
      <option value="outside">Außenansicht · gesamtes Haus</option>
      <option value="ground">Ground Floor · öffentliche Räume</option>
      <option value="state">State Floor · Repräsentationsräume</option>
      <option value="second">Second Floor · Hülle</option>
      <option value="third">Third Floor · Hülle</option>
      <option value="sub1">Unterebene I · Hülle</option>
      <option value="sub2">Unterebene II · Hülle</option>
    </select>
    <button id="top-view" type="button">Draufsicht</button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import {baueHaus} from './src/haus3d.js';
    const status=document.querySelector('#status'),error=document.querySelector('#error');
    try {
      const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
      renderer.outputColorSpace=THREE.SRGBColorSpace;
      renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.setSize(innerWidth,innerHeight);
      document.querySelector('#scene').appendChild(renderer.domElement);
      const scene=new THREE.Scene();scene.background=new THREE.Color(0xaac2cc);
      scene.add(new THREE.HemisphereLight(0xe8f0ff,0x827c68,2.0));
      const sunlight=new THREE.DirectionalLight(0xffe8cf,2.5);sunlight.position.set(-30,50,36);scene.add(sunlight);
      const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.15,280);
      const {root,setLevel,HAUS}=baueHaus();scene.add(root);
      const selected=document.querySelector('#floor');
      const topButton=document.querySelector('#top-view');
      let focus=new THREE.Vector3(0,7.7,0),radius=87,azimuth=.59,elevation=1.05,topDown=false;
      let pointers=new Map(),lastPinch=null;
      function orient(){
        const height=Math.max(.07,Math.min(Math.PI-.05,elevation));
        camera.position.set(focus.x+radius*Math.sin(height)*Math.cos(azimuth),
          focus.y+radius*Math.cos(height),
          focus.z+radius*Math.sin(height)*Math.sin(azimuth));
        camera.lookAt(focus);
      }
      function applyMode(mode){
        const entry=setLevel(mode),outside=mode==='outside';
        focus.set(0,outside?7.7:(entry?.y||0),0);
        radius=outside?84:60;azimuth=outside?-.78:-.55;
        elevation=outside?1.22:.35;topDown=!outside;
        topButton.textContent=topDown?'Schrägansicht':'Draufsicht';
        status.textContent=outside?'Außenmaße 51,2 × 26,1 m (ohne Portiken). Gebäudeform und Fassadendetails in Entwicklung.':
          `${entry.name}: ${entry.status}. Raummaße und Wandpositionen sind hier noch keine Vermessungsdaten.`;
        orient();
      }
      selected.addEventListener('change',()=>applyMode(selected.value));
      topButton.addEventListener('click',()=>{
        topDown=!topDown;elevation=topDown?.05:1.00;topButton.textContent=topDown?'Schrägansicht':'Draufsicht';orient();
      });
      const canvas=renderer.domElement;
      canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});});
      canvas.addEventListener('pointermove',e=>{
        if(!pointers.has(e.pointerId))return;
        const prior=pointers.get(e.pointerId),dx=e.clientX-prior.x,dy=e.clientY-prior.y;
        pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pointers.size===1){azimuth-=dx*.006;elevation=Math.max(.06,Math.min(2.6,elevation-dy*.005));orient();}
        if(pointers.size===2){const [a,b]=[...pointers.values()];const distance=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch!==null){radius=Math.max(28,Math.min(140,radius*(lastPinch/distance)));orient();}lastPinch=distance;}
      });
      const end=e=>{pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=null;};
      canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
      canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(28,Math.min(140,radius*(e.deltaY>0?1.08:.92)));orient();},{passive:false});
      addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
      const hash=new URLSearchParams(location.search).get('floor');if(hash&&[...selected.options].some(x=>x.value===hash))selected.value=hash;
      applyMode(selected.value);
      let frame=0;function draw(){frame=requestAnimationFrame(draw);renderer.render(scene,camera);}draw();
      addEventListener('pagehide',()=>{cancelAnimationFrame(frame);renderer.dispose();});
    }catch(e){console.error(e);error.style.display='block';error.textContent='3D-Ansicht konnte nicht gestartet werden: '+e.message;status.textContent='Start fehlgeschlagen';}
  </script>
</body>
</html>
