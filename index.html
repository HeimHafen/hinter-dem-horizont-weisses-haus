<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#18251f"/>
<meta name="description" content="Hinter dem Horizont – Nordfassade: Nordportiko: ein durchgehendes Dachvolumen, sauberer Giebel, Dachanschluss und Zahnschnitt."/>
<title>Hinter dem Horizont · Weißes Haus · Nordfassade A0.1.9</title>
<style>
:root {--ink:#1b2822;--fg:#fff9ef;--edge:#b7b2a4}
*{box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;margin:0;background:#b9cadd;font:14px system-ui,-apple-system,sans-serif;color:var(--fg)}
#view{position:fixed;inset:0;background:linear-gradient(180deg,#a5bed8 0%,#cbd5dc 53%,#e9e3d6 100%)}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#info{position:fixed;z-index:2;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;max-width:485px;background:#1b2924e8;padding:13px 15px;border:1px solid #ffffff33;border-radius:15px;box-shadow:0 4px 18px #0003;pointer-events:none}
h1{font:clamp(21px,5vw,28px)/1.2 Georgia,serif;margin:0 0 5px}
#info p{margin:0;color:#e9e5da;font-size:12px}
#state{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 102px);right:12px;color:#e9e4d9;background:#1b2924e3;border-radius:10px;padding:7px 10px;z-index:2;font-size:11px}
#help{position:fixed;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 84px);background:#1b2924d9;color:#e9e4d9;z-index:2;border-radius:12px;padding:10px;pointer-events:none;font-size:12px}
#bottom{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:8px;justify-content:center;z-index:4}
button{background:#1c2b25ed;color:#fff9ec;border:1px solid #c1c3b5;border-radius:12px;min-height:48px;padding:0 12px;font-size:12px;flex:1;max-width:170px}
button:focus-visible{outline:3px solid #ffbd78}
#error{display:none;position:fixed;top:40%;left:5%;right:5%;color:white;background:#702d2dfa;line-height:1.5;padding:16px;border-radius:14px;z-index:5}
@media(max-width:400px){#info{max-width:calc(100% - 24px)}#bottom button{font-size:12px;padding:0 6px}}
</style>
</head>
<body>
<div id="view"></div>
<div id="info"><h1>Hinter dem Horizont</h1><p>Weißes Haus · Nordfassade · Architektur A0.1.9</p></div>
<div id="state">Modell wird geladen …</div>
<div id="help">Finger: drehen · zwei Finger: zoomen</div>
<div id="error" role="alert"></div>
<div id="bottom"><button id="north">Nordfassade</button><button id="detail">Portiko-Details</button><button id="south">Südfassade</button><button id="reset">Übersicht</button></div>
<script>
'use strict';
(async function(){
 const state=document.getElementById('state'),err=document.getElementById('error'),host=document.getElementById('view');
 const canvas=document.createElement('canvas');host.appendChild(canvas);
 const gl=canvas.getContext('webgl2',{alpha:true,antialias:true,depth:true,powerPreference:'high-performance'})||canvas.getContext('webgl',{alpha:true,antialias:true,depth:true,powerPreference:'default'});
 const twoD=!gl?canvas.getContext('2d'):null; if(!gl&&!twoD)throw new Error('Weder WebGL noch Canvas-2D verfügbar.');
 const vertex=`attribute vec3 aPosition; attribute vec3 aNormal; attribute vec3 aColor;
 uniform mat4 uMVP; varying vec3 vN; varying vec3 vC; varying vec3 vPos;
 void main(){vN=aNormal;vC=aColor;vPos=aPosition;gl_Position=uMVP*vec4(aPosition,1.0);}`;
 const fragment=`precision mediump float;
 varying vec3 vN;varying vec3 vC;varying vec3 vPos;
 uniform vec3 uEye;
 void main(){vec3 n=normalize(vN);vec3 sun=normalize(vec3(-.42,.88,.29));
 float diffuse=max(dot(n,sun),0.0);
 float skyfill=.64+.19*max(n.y,0.0);
 float bounced=.08*max(dot(n,normalize(vec3(.56,.24,-.42))),0.0);
 float light=skyfill+.48*diffuse+bounced;
 // Subtle world-space stone tonal variation; normals and real GLB surface relief remain visible.
 float noise=fract(sin(dot(floor(vPos.xy*16.0+vPos.z*1.1),vec2(12.9898,78.233)))*43758.5453);
 float limestone=step(.68,vC.r)*step(.68,vC.g);
 float rock=mix(1.0,.986+.020*noise,limestone);
 vec3 color=clamp(vC*light*rock,0.0,1.0);
 vec3 haze=vec3(.77,.82,.83);float fog=clamp((distance(vPos,uEye)-125.0)/185.0,0.0,.32);
 gl_FragColor=vec4(mix(color,haze,fog),1.0);}`;
 let prog=null,apos=-1,anorm=-1,acolor=-1,umvp=null,ueye=null;
 if(gl){
 function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'Shader-Fehler');return s;}
 prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(prog);
 if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog)||'WebGL-Programmfehler');
 gl.useProgram(prog);
 apos=gl.getAttribLocation(prog,'aPosition'); anorm=gl.getAttribLocation(prog,'aNormal');acolor=gl.getAttribLocation(prog,'aColor');
 umvp=gl.getUniformLocation(prog,'uMVP'); ueye=gl.getUniformLocation(prog,'uEye');
 }
 // Material colors are read from the GLB. Unlike the original A0.1.3, no fixed 8-color table.
 const fallbackColors=[ [.88,.86,.83], [.96,.94,.90], [.14,.20,.24], [.18,.30,.16], [.48,.45,.41], [.12,.22,.12], [.24,.12,.07], [.64,.48,.23] ];
 const resp=await fetch('./assets/Weisses-Haus-Nord-A019.glb',{cache:'no-store'});
 if(!resp.ok)throw new Error('Gebäudedatei fehlt (HTTP '+resp.status+'). Modell muss unter assets/Weisses-Haus-Nord-A019.glb liegen.');
 const bytes=await resp.arrayBuffer(),v=new DataView(bytes);
 if(v.getUint32(0,true)!==0x46546c67)throw new Error('Die GLB-Datei ist ungültig.');
 const jsonLen=v.getUint32(12,true),jsonType=v.getUint32(16,true);
 if(jsonType!==0x4e4f534a)throw new Error('GLB enthält kein JSON.');
 const dec=new TextDecoder().decode(new Uint8Array(bytes,20,jsonLen));
 const doc=JSON.parse(dec);
 const colors=(doc.materials||[]).map((m,i)=>m.pbrMetallicRoughness?.baseColorFactor?.slice(0,3)||fallbackColors[i]||fallbackColors[0]);
 const binHead=20+jsonLen,binLen=v.getUint32(binHead,true),binOff=binHead+8;
 if(v.getUint32(binHead+4,true)!==0x004e4942)throw new Error('GLB enthält keine Geometrie.');
 function accessor(i){const a=doc.accessors[i],bv=doc.bufferViews[a.bufferView],off=binOff+(bv.byteOffset||0)+(a.byteOffset||0);const num=a.type==='VEC3'?3:a.type==='VEC2'?2:1;const stride=bv.byteStride||num*(a.componentType===5126?4:a.componentType===5125?4:a.componentType===5123?2:1);let out=new Array(a.count*num);for(let j=0;j<a.count;j++)for(let k=0;k<num;k++){
 const b=off+j*stride+k*(a.componentType===5126?4:a.componentType===5125?4:a.componentType===5123?2:1);
 out[j*num+k]=a.componentType===5126?v.getFloat32(b,true):a.componentType===5125?v.getUint32(b,true):a.componentType===5123?v.getUint16(b,true):v.getUint8(b);
 }return out;}
 const vertices=[];
 function rotate(q,p){const [x,y,z,w]=q, [vx,vy,vz]=p;
 const tx=2*(y*vz-z*vy),ty=2*(z*vx-x*vz),tz=2*(x*vy-y*vx);
 return [vx+w*tx+(y*tz-z*ty),vy+w*ty+(z*tx-x*tz),vz+w*tz+(x*ty-y*tx)];}
 const cache=new Map();
 for(const node of doc.nodes){if(node.mesh==null)continue;const m=doc.meshes[node.mesh];const sc=node.scale||[1,1,1],tr=node.translation||[0,0,0],q=node.rotation||[0,0,0,1];
 const M=node.matrix||null;
 const ms=M?[Math.hypot(M[0],M[1],M[2])||1,Math.hypot(M[4],M[5],M[6])||1,Math.hypot(M[8],M[9],M[10])||1]:null;
 const transformPos=(x,y,z)=>M?[M[0]*x+M[4]*y+M[8]*z+M[12],M[1]*x+M[5]*y+M[9]*z+M[13],M[2]*x+M[6]*y+M[10]*z+M[14]]:rotate(q,[x*sc[0],y*sc[1],z*sc[2]]).map((a,i)=>a+tr[i]);
 const transformNorm=(x,y,z)=>M?[(M[0]/(ms[0]*ms[0]))*x+(M[4]/(ms[1]*ms[1]))*y+(M[8]/(ms[2]*ms[2]))*z,(M[1]/(ms[0]*ms[0]))*x+(M[5]/(ms[1]*ms[1]))*y+(M[9]/(ms[2]*ms[2]))*z,(M[2]/(ms[0]*ms[0]))*x+(M[6]/(ms[1]*ms[1]))*y+(M[10]/(ms[2]*ms[2]))*z]:rotate(q,[x/(sc[0]||1),y/(sc[1]||1),z/(sc[2]||1)]);
 for(const p of m.primitives){let pos=cache.get(p.attributes.POSITION);if(!pos){pos=accessor(p.attributes.POSITION);cache.set(p.attributes.POSITION,pos);}
 let norm=null;
 if(p.attributes.NORMAL!=null){norm=cache.get(p.attributes.NORMAL);if(!norm){norm=accessor(p.attributes.NORMAL);cache.set(p.attributes.NORMAL,norm);}}
 const ids=accessor(p.indices),base=colors[p.material]||fallbackColors[0];
 let faceN=[0,1,0];
 for(let t=0;t<ids.length;t++){const id=ids[t];
 if(!norm && t%3===0){
  const a=ids[t],b=ids[t+1],c=ids[t+2];
  const pa=transformPos(pos[a*3],pos[a*3+1],pos[a*3+2]),
   pb=transformPos(pos[b*3],pos[b*3+1],pos[b*3+2]),
   pc=transformPos(pos[c*3],pos[c*3+1],pos[c*3+2]);
  const ab=[pb[0]-pa[0],pb[1]-pa[1],pb[2]-pa[2]], ac=[pc[0]-pa[0],pc[1]-pa[1],pc[2]-pa[2]];
  faceN=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]];
 }
 let pt=transformPos(pos[id*3],pos[id*3+1],pos[id*3+2]);
 let nn=norm?transformNorm(norm[id*3],norm[id*3+1],norm[id*3+2]):faceN;
 const mag=Math.hypot(...nn)||1;vertices.push(pt[0],pt[1],pt[2],nn[0]/mag,nn[1]/mag,nn[2]/mag,...base);
 }
 }
 }
 if(vertices.length<1000)throw new Error('Das Gebäudemodell enthält keine ausreichende Geometrie.');
 if(gl){
 const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);
 const stride=9*4;for(const [a,offset] of [[apos,0],[anorm,3*4],[acolor,6*4]]){gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,stride,offset);}
 gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);
 }
 let theta=Math.PI/2-.11,phi=.14,radius=115,dragging=false,ptX=0,ptY=0,lastPinch=0;
 function perspective(fovy,aspect,near,far){let f=1/Math.tan(fovy/2),nf=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]);}
 const sub=(a,b)=>a.map((v,i)=>v-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),normalize=a=>{const len=Math.hypot(...a)||1;return a.map(v=>v/len);};
 function lookAt(eye,center){const f=normalize(sub(center,eye)),s=normalize(cross(f,[0,1,0])),u=cross(s,f);
 return [s[0],u[0],-f[0],0,s[1],u[1],-f[1],0,s[2],u[2],-f[2],0,-dot(s,eye),-dot(u,eye),dot(f,eye),1];}
 function multiply(a,b){let o=new Float32Array(16);for(let col=0;col<4;col++)for(let row=0;row<4;row++)for(let k=0;k<4;k++)o[col*4+row]+=a[k*4+row]*b[col*4+k];return o;}
 function frame(){const dpr=Math.min(devicePixelRatio||1,gl?1.8:1.15),width=Math.max(1,Math.floor(innerWidth*dpr)),height=Math.max(1,Math.floor(innerHeight*dpr));
 if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;if(gl)gl.viewport(0,0,width,height);}
 const target=[0,7,0],eye=[radius*Math.cos(phi)*Math.cos(theta),7+radius*Math.sin(phi),radius*Math.cos(phi)*Math.sin(theta)];
 const mvp=multiply(perspective(55*Math.PI/180,width/height,.1,500),lookAt(eye,target));
 if(gl){
 gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.uniformMatrix4fv(umvp,false,mvp);gl.uniform3f(ueye,...eye);gl.drawArrays(gl.TRIANGLES,0,vertices.length/9);
 }else{
 twoD.clearRect(0,0,width,height);
 const polys=[];
 const project=(x,y,z)=>{const w=mvp[3]*x+mvp[7]*y+mvp[11]*z+mvp[15];if(w<=.2)return null;const sx=(mvp[0]*x+mvp[4]*y+mvp[8]*z+mvp[12])/w,sy=(mvp[1]*x+mvp[5]*y+mvp[9]*z+mvp[13])/w;return [(sx*.5+.5)*width,(.5-sy*.5)*height,w];};
 for(let t=0;t<vertices.length;t+=27){
  const a=project(vertices[t],vertices[t+1],vertices[t+2]);
  const b=project(vertices[t+9],vertices[t+10],vertices[t+11]);
  const c=project(vertices[t+18],vertices[t+19],vertices[t+20]);
  if(!a||!b||!c)continue;
  const minX=Math.min(a[0],b[0],c[0]),maxX=Math.max(a[0],b[0],c[0]),minY=Math.min(a[1],b[1],c[1]),maxY=Math.max(a[1],b[1],c[1]);
  if(maxX<0||minX>width||maxY<0||minY>height)continue;
  const nx=vertices[t+3],ny=vertices[t+4],nz=vertices[t+5];
  const light=.64+.19*Math.max(0,ny)+.48*Math.max(0,nx*(-.42)+ny*.88+nz*.29)+.08*Math.max(0,nx*.56+ny*.24-nz*.42);
  const rgb=[vertices[t+6],vertices[t+7],vertices[t+8]].map(v=>Math.max(0,Math.min(255,Math.floor(v*light*255))));
  polys.push({a,b,c,z:(a[2]+b[2]+c[2])/3,fill:`rgb(${rgb.join(',')})`});
 }
 polys.sort((a,b)=>b.z-a.z);for(const tri of polys){twoD.beginPath();twoD.moveTo(tri.a[0],tri.a[1]);twoD.lineTo(tri.b[0],tri.b[1]);twoD.lineTo(tri.c[0],tri.c[1]);twoD.closePath();twoD.fillStyle=tri.fill;twoD.fill();}
 }
 }
 let scheduled=false;function draw(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;frame();});}
 function viewAngle(angle,r=112,p=.19){theta=angle;phi=p;radius=innerWidth<700?r:Math.min(100,r);draw();}
 document.getElementById('north').addEventListener('click',()=>viewAngle(Math.PI/2-.025,110,.11));
 document.getElementById('south').addEventListener('click',()=>viewAngle(-Math.PI/2+.025,115,.18));
 document.getElementById('detail').addEventListener('click',()=>viewAngle(Math.PI/2,56,.07));
 document.getElementById('reset').addEventListener('click',()=>viewAngle(Math.PI/2-.45,126,.28));
 canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);if(e.isPrimary){dragging=true;ptX=e.clientX;ptY=e.clientY;}});
 canvas.addEventListener('pointerup',()=>{dragging=false;lastPinch=0;});canvas.addEventListener('pointercancel',()=>{dragging=false;lastPinch=0;});
 canvas.addEventListener('pointermove',e=>{if(!dragging)return;let dx=e.clientX-ptX,dy=e.clientY-ptY;ptX=e.clientX;ptY=e.clientY;theta-=dx*.006;phi=Math.max(.09,Math.min(1.35,phi+dy*.004));draw();});
 const fingers=new Map();canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches)fingers.set(t.identifier,[t.clientX,t.clientY]);if(fingers.size===2)dragging=false;},{passive:true});
 canvas.addEventListener('touchmove',e=>{for(const t of e.changedTouches)fingers.set(t.identifier,[t.clientX,t.clientY]);if(fingers.size>=2){const [a,b]=[...fingers.values()];const dist=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastPinch)radius=Math.max(37,Math.min(210,radius*lastPinch/dist));lastPinch=dist;draw();}},{passive:true});
 canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)fingers.delete(t.identifier);lastPinch=0;dragging=false;},{passive:true});
 canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(37,Math.min(210,radius*(1+Math.sign(e.deltaY)*.08)));draw();},{passive:false});
 addEventListener('resize',draw);frame();state.textContent=(gl?'3D aktiv · ':'Canvas-3D aktiv · ')+doc.nodes.filter(n=>n.mesh!=null).length+' sichtbare Bauteilgruppen · Nordfassade A0.1.9';
})().catch(error=>{console.error(error);const e=document.getElementById('error');e.textContent='Startfehler: '+error.message;e.style.display='block';document.getElementById('state').textContent='Modell konnte nicht geladen werden';});
</script>
</body>
