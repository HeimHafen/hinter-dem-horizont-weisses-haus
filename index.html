<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {baueSpielfigur} from './spielfigur.js?v=2';
import {baueCrossHallV5,ladeCrossHallAssetsV5,versperrtCrossHallV5} from './cross-hall-v6.js?v=7-carpet';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {setzeHistorischeKonsolenV6} from './cross-hall-furniture-v6.js?v=61';
import {ladeCrossHallTeppichV7} from './cross-hall-carpet-v7.js?v=7';
const place=document.querySelector('#place'), gate=document.querySelector('#gate');
try { await start(); } catch(error) {
  console.error(error);
  place.textContent='Spielstart fehlgeschlagen: '+error.message;
}
async function start(){
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xb5ccdf);
  const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.035,460);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  document.body.append(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xe0ecff,0x82745d,1.12));
  const sun=new THREE.DirectionalLight(0xffebd8,2.2);
  sun.position.set(-14,12,6);
  scene.add(sun);
  place.textContent='Weiße-Haus-Modell wird geladen …';
  const {scene:model}=await new GLTFLoader().loadAsync('./Weisses-Haus-Innen.glb');
  scene.add(model);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  sun.target.position.z=36;
  scene.add(sun.target);
  sun.position.set(-35,48,72);
  // Camera-centered sky. Only pixels behind the scene need cloud shading.
  const sky = new THREE.Mesh(new THREE.SphereGeometry(350,32,16), new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{
      sunDirection:{value:sun.position.clone().normalize()},
      drift:{value:0}
    },
    vertexShader:`
      varying vec3 ray;
      void main(){
        ray=position;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
      }
    `,
    fragmentShader:`
      varying vec3 ray;
      uniform vec3 sunDirection;
      uniform float drift;

      float hash(vec2 p){
        vec3 q=fract(vec3(p.xyx)*0.1031);
        q+=dot(q,q.yzx+33.33);
        return fract((q.x+q.y)*q.z);
      }
      float noise(vec2 p){
        vec2 i=floor(p), f=fract(p);
        f=f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
                   mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
      }
      float cloudShape(vec2 p){
        return .57*noise(p)+.26*noise(p*2.03+7.2)
             +.12*noise(p*4.21-4.8)+.05*noise(p*8.17+2.4);
      }
      void main(){
        vec3 d=normalize(ray);
        float height=max(d.y,0.0);
        float sun=max(dot(d,sunDirection),0.0);
        vec3 color=mix(vec3(.56,.69,.77),vec3(.095,.31,.59),
                       pow(smoothstep(0.0,.83,height),.56));
        color+=vec3(.28,.20,.10)*pow(sun,14.0);
        if(height>.025){
          vec2 p=d.xz/(height+.16)*2.7+vec2(4.6,7.2)+vec2(drift,drift*.28);
          float shape=cloudShape(p);
          float opacity=smoothstep(.49,.69,shape)*smoothstep(.035,.19,height);
          float shade=smoothstep(.45,.73,cloudShape(p-sunDirection.xz*.27));
          vec3 cloud=mix(vec3(.97,.96,.91),vec3(.61,.67,.75),shade*.82);
          color=mix(color,cloud,opacity*.95);
        }
        color+=vec3(2.3,1.9,1.4)*smoothstep(.99992,.99999,sun);
        gl_FragColor=vec4(color,1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `
  }));
  sky.renderOrder=1000;
  sky.frustumCulled=false;
  scene.add(sky);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-53,right:53,top:62,bottom:-62,near:1,far:175});
  sun.shadow.normalBias=.031;
  sun.shadow.bias=-.00012;
  model.traverse(o=>{
    if(!o.isMesh)return;
    if(/^Cube[.]?442$/.test(o.name))o.visible=false;
    o.receiveShadow=true;
    o.castShadow=o.material.name!=='Rasen'&&o.material.name!=='Kies';
  });
  // Exterior detail uses the same coordinates as the existing entrance.
  const exterior = new THREE.Group();
  scene.add(exterior);
  const stone = new THREE.MeshStandardMaterial({color:0xe7dfcf,roughness:.77});
  const roof = new THREE.MeshStandardMaterial({color:0x535e59,roughness:.81});
  function surface(x,y,z,w,h,d,material){
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
    mesh.position.set(x,y,z);
    mesh.castShadow=mesh.receiveShadow=true;
    exterior.add(mesh);
  }
  surface(0,14.42,-1,45,.6,22,roof);
  surface(0,15.1,-2,35,.85,16,stone);
  surface(0,15.59,-2,35.6,.22,16.6,roof);
  for(const x of [-17,-10,10,17])for(const z of [-8,5]){
    surface(x,16,z,1.19,2.1,1.05,stone);
    surface(x,17.08,z,1.45,.24,1.32,stone);
  }
  const glass = new THREE.MeshStandardMaterial({color:0x243b4b,roughness:.21,metalness:.12});
  for(const side of [-1,1]){
    surface(side*24.1,14.95,0,.3,.27,24.5,stone);
    for(let i=0;i<33;i++)surface(side*24.1,14.53,-11.9+i*.744,.27,.8,.19,stone);
    for(let z=-9;z<=10;z+=4)for(const [y,h] of [[2.75,2.85],[7.8,2.75],[11.92,1.85]]){
      surface(side*23.59,y,z,.18,h+.22,2.04,stone);
      surface(side*23.7,y,z,.12,h,1.7,glass);
      for(const offset of [-.56,0,.56])surface(side*23.78,y,z+offset,.05,h,.047,stone);
      for(const offset of [-.26,0,.26])surface(side*23.78,y+h*offset,z,.05,.047,1.7,stone);
      surface(side*23.8,y-h/2-.12,z,.41,.17,2.2,stone);
    }
    for(let i=0;i<11;i++)surface(side*7.7,1.2,17.4-i*.45,.13,.67,.155,stone);
    surface(side*7.7,1.57,15.15,.31,.16,4.85,stone);
  }
  // Hide the baked exterior window assemblies and their separate lintels.
  model.traverse(piece=>{
    const match=/^Cube[.]?(\d+)$/.exec(piece.name);
    if(!piece.isMesh||!match)return;
    const id=Number(match[1]);
    if((id>=141&&id<=374)||(id>=504&&id<=517))piece.visible=false;
  });
  const reflectionCanvas=document.createElement('canvas');
  reflectionCanvas.width=256;
  reflectionCanvas.height=128;
  const paint=reflectionCanvas.getContext('2d');
  const gradient=paint.createLinearGradient(0,0,0,128);
  for(const [offset,color] of [[0,'#568dc1'],[.37,'#a1c4df'],[.50,'#d2dce0'],[.55,'#566047'],[1,'#30392b']]){
    gradient.addColorStop(offset,color);
  }
  paint.fillStyle=gradient;
  paint.fillRect(0,0,256,128);
  const reflection=new THREE.CanvasTexture(reflectionCanvas);
  reflection.colorSpace=THREE.SRGBColorSpace;
  reflection.mapping=THREE.EquirectangularReflectionMapping;
  const pmrem=new THREE.PMREMGenerator(renderer);
  const windowEnvironment=pmrem.fromEquirectangular(reflection);
  reflection.dispose();
  pmrem.dispose();
  function dressGlass(material){
    material.envMap=windowEnvironment.texture;
    material.envMapIntensity=.55;
    material.roughness=.29;
    material.metalness=.17;
  }
  dressGlass(glass);

  // Exterior mouldings follow the existing building footprint and doorway.
  const limestoneShadow=new THREE.MeshStandardMaterial({color:0xb8ae9d,roughness:.88});
  const paintedSash=new THREE.MeshStandardMaterial({color:0xece4d6,roughness:.55});
  for(const [y,h,d] of [[.94,.17,.23],[4.57,.12,.24],[5.02,.20,.35],
    [9.46,.12,.23],[13.17,.16,.35],[13.69,.22,.47],[14.1,.16,.48]]){
    if(y<5.2){
      for(const side of [-1,1])surface(side*12.50,y,12.18,21.7,h,d,stone);
    }else surface(0,y,12.18,46.7,h,d,stone);
    for(const side of [-1,1])surface(side*23.55,y,0,d,h,24.35,stone);
  }
  for(const side of [-1,1]){
    for(let x=21.5;x<=23.2;x+=.82){
      for(let row=0;row<9;row++)
        surface(side*x,1.47+row*1.31,12.223,row%2?.54:.69,.22,.077,stone);
    }
  }
  for(let x=-22.8;x<=22.8;x+=.46){
    if(Math.abs(x)<7.9)continue;
    surface(x,13.53,12.28,.16,.21,.24,stone);
  }
  // North elevation: three central axes and four outer axes per side.
  const northAxes=[-20.25,-16.8,-13.35,-9.9,-4.1,0,4.1,9.9,13.35,16.8,20.25];
  const northWindowLevels=[
    {y:2.72,h:2.73,w:1.62,rows:6},
    {y:7.52,h:2.78,w:1.65,rows:6},
    {y:11.82,h:1.65,w:1.58,rows:4}
  ];
  function northWindowCrown(x,y,span,curved){
    const rise=.32;
    const profile=new THREE.Shape();
    profile.moveTo(-span,y);
    if(curved)profile.quadraticCurveTo(0,y+2*rise,span,y);
    else profile.lineTo(0,y+rise);
    profile.lineTo(span,y);
    profile.lineTo(-span,y);
    const infill=new THREE.Mesh(new THREE.ShapeGeometry(profile,24),stone);
    infill.position.set(x,0,12.42);
    infill.receiveShadow=true;
    exterior.add(infill);
    const points=Array.from({length:25},(_,i)=>{
      const t=i/12-1;
      const height=curved?rise*(1-t*t):rise*(1-Math.abs(t));
      return new THREE.Vector3(x+t*span,y+height,12.455);
    });
    // A straight two-part profile keeps the peak of the triangular caps sharp.
    if(!curved){
      for(const side of [-1,1]){
        const edge=new THREE.Mesh(new THREE.BoxGeometry(Math.hypot(span,rise),.105,.26),stone);
        edge.position.set(x+side*span/2,y+rise/2,12.425);
        edge.rotation.z=-side*Math.atan2(rise,span);
        edge.castShadow=edge.receiveShadow=true;
        exterior.add(edge);
      }
    }else{
      const edge=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),24,.067,8,false),stone);
      edge.castShadow=edge.receiveShadow=true;
      exterior.add(edge);
    }
  }
  northAxes.forEach((x,index)=>{
    northWindowLevels.forEach(({y,h,w,rows},level)=>{
      if((level===0&&x===0)||(level===2&&Math.abs(x)<=4.1))return;
      const top=y+h/2;
      const sill=y-h/2;
      surface(x,y,12.10,w+.30,h+.25,.24,stone);
      surface(x,y,12.235,w+.08,h+.06,.035,limestoneShadow);
      surface(x,y,12.258,w,h,.025,glass);
      for(const side of [-1,1]){
        surface(x+side*(w/2+.065),y,12.33,.13,h+.16,.17,stone);
        surface(x+side*w/2,y,12.29,.046,h,.045,paintedSash);
      }
      for(const offset of [-w/6,w/6])surface(x+offset,y,12.289,.031,h,.04,paintedSash);
      for(let row=0;row<=rows;row++){
        surface(x,sill+h*row/rows,12.29,w,.036+(row===rows/2?.035:0),.04,paintedSash);
      }
      surface(x,sill-.066,12.22,w+.34,.132,.51,stone);
      surface(x,top+.095,12.34,w+.32,.13,.23,stone);
      if(level===1){
        surface(x,top+.198,12.40,w+.55,.098,.33,stone);
        northWindowCrown(x,top+.247,(w+.50)/2,index%2===0);
        for(const side of [-1,1])surface(x+side*(w/2+.075),top-.057,12.38,.115,.38,.20,stone);
      }
    });
  });
  // Continue the stone courses around the rear while leaving the passage geometry intact.
  for(const [y,h,d] of [[1.02,.16,.18],[5.02,.18,.27],[9.46,.12,.21],[13.69,.22,.33]])
    surface(0,y,-12.16,46.7,h,d,stone);
  for(const x of [-20,-15,-10,-5,0,5,10,15,20])
    for(const [y,h] of [[2.75,2.54],[7.8,2.72],[11.92,1.76]]){
      surface(x,y,-12.25,1.92,h+.22,.12,stone);
      surface(x,y,-12.33,1.61,h,.05,glass);
      for(const offset of [-.79,-.263,.263,.79])
        surface(x+offset,y,-12.37,.047,h,.04,paintedSash);
      for(const offset of [-.48,-.24,0,.24,.48])
        surface(x,y+h*offset,-12.37,1.62,.046,.04,paintedSash);
      surface(x,y-h/2-.1,-12.38,2.04,.13,.24,stone);
    }
  // The south portico has a curved colonnade and a continuous balcony.
  function southArc(radius,y,height,material){
    const geometry=new THREE.CylinderGeometry(radius,radius,height,64);
    const mesh=new THREE.Mesh(geometry,material);
    mesh.position.set(0,y,-10.85);
    mesh.scale.x=1.46;
    mesh.castShadow=mesh.receiveShadow=true;
    exterior.add(mesh);
  }
  for(const [radius,y,height] of [[5.68,.28,.31],[5.48,.51,.22],[5.27,.72,.20],
    [5.05,6.23,.18],[5.25,6.43,.24],[5.35,6.60,.10],
    [4.98,11.81,.21],[5.21,12.05,.27],[5.32,12.24,.13]])
    southArc(radius,y,height,stone);
  for(const angle of [-1.06,-.65,-.22,.22,.65,1.06]){
    const x=6.82*Math.sin(angle),z=-10.85-4.68*Math.cos(angle);
    for(const [bottom,top,baseRadius] of [[.83,6.14,.27],[6.66,11.70,.23]]){
      surface(x,bottom+.075,z,baseRadius*2.75,.15,baseRadius*2.75,stone);
      const column=new THREE.Mesh(new THREE.CylinderGeometry(
        baseRadius*.79,baseRadius,top-bottom-.28,28),stone);
      column.position.set(x,(bottom+top)/2,z);
      column.castShadow=column.receiveShadow=true;
      exterior.add(column);
      surface(x,top-.067,z,baseRadius*2.64,.134,baseRadius*2.64,stone);
    }
  }
  for(const [y,radius] of [[7.30,5.14],[12.96,5.21]]){
    const points=Array.from({length:33},(_,i)=>{
      const a=-1.35+i*2.70/32;
      return new THREE.Vector3(1.46*radius*Math.sin(a),y,-10.85-radius*Math.cos(a));
    });
    const rail=new THREE.Mesh(new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3(points),64,.065,8,false),stone);
    rail.castShadow=rail.receiveShadow=true;
    exterior.add(rail);
    for(const point of points)surface(point.x,y-.30,point.z,.113,.58,.113,stone);
  }
  for(const side of [-1,1]){
    const iron=new THREE.MeshStandardMaterial({color:0x34302a,roughness:.48,metalness:.62});
    const lanternGlass=new THREE.MeshStandardMaterial({
      color:0xdcc49b,roughness:.41,emissive:0x715322,emissiveIntensity:.28
    });
    const x=side*2.07;
    surface(x,2.89,12.48,.34,.55,.29,lanternGlass);
    for(const y of [2.59,3.19])surface(x,y,12.48,.42,.086,.37,iron);
    for(const dx of [-.18,.18])for(const dz of [-.15,.15])
      surface(x+dx,2.89,12.48+dz,.027,.60,.027,iron);
    surface(x,3.29,12.45,.11,.14,.11,iron);
    surface(x,3.37,12.31,.10,.055,.34,iron);
  }

  function grain(material,scale,strength){
    material.customProgramCacheKey=()=>`grain-${scale}-${strength}`;
    material.onBeforeCompile=shader=>{
      shader.vertexShader='varying vec3 grainPoint;\n'+shader.vertexShader.replace(
        '#include <project_vertex>',
        'grainPoint=(modelMatrix*vec4(transformed,1.0)).xyz;\n#include <project_vertex>');
      shader.fragmentShader=`varying vec3 grainPoint;
      float grainHash(vec3 p){
        p=fract(p*.1031);
        p+=dot(p,p.yzx+33.33);
        return fract((p.x+p.y)*p.z);
      }
      float grainNoise(vec3 p){
        vec3 i=floor(p),f=fract(p);
        f=f*f*(3.0-2.0*f);
        return mix(
          mix(mix(grainHash(i),grainHash(i+vec3(1,0,0)),f.x),
              mix(grainHash(i+vec3(0,1,0)),grainHash(i+vec3(1,1,0)),f.x),f.y),
          mix(mix(grainHash(i+vec3(0,0,1)),grainHash(i+vec3(1,0,1)),f.x),
              mix(grainHash(i+vec3(0,1,1)),grainHash(i+vec3(1,1,1)),f.x),f.y),f.z);
      }
      `+shader.fragmentShader.replace(
        '#include <color_fragment>',`#include <color_fragment>
        vec3 p=grainPoint*${scale.toFixed(2)};
        float broad=2.0*grainNoise(p*.14)-1.0;
        float fine=2.0*grainNoise(p)-1.0;
        float fade=1.0-smoothstep(.12,1.1,length(fwidth(p)));
        diffuseColor.rgb *= 1.0+${strength.toFixed(3)}*(broad*.68+fine*.32*fade);
      `);
    };
  }
  // North Lawn: the carriage drive curves around the fountain on the house axis.
  const driveMaterial=new THREE.MeshStandardMaterial({color:0x777670,roughness:.98,side:THREE.DoubleSide});
  const granite=new THREE.MeshStandardMaterial({color:0xb8b7ad,roughness:.89,side:THREE.DoubleSide});
  grain(driveMaterial,28,.19);
  grain(granite,17,.14);
  const fountainZ=31.2, fountainRadius=2.64;
  function driveRibbon(offset,width,height,material){
    const vertices=[],indices=[];
    for(let i=0;i<=96;i++){
      const a=i/96*Math.PI;
      const x=26*Math.cos(a),z=46-23*Math.sin(a);
      const nx=Math.cos(a)/26,nz=-Math.sin(a)/23;
      const norm=Math.hypot(nx,nz);
      for(const edge of [-1,1]){
        const d=(offset+edge*width/2)/norm;
        vertices.push(x+nx*d,height,z+nz*d);
      }
      const k=i*2;
      if(i)indices.push(k-2,k-1,k,k-1,k+1,k);
    }
    const geometry=new THREE.BufferGeometry();
    geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    const mesh=new THREE.Mesh(geometry,material);
    mesh.receiveShadow=true;
    exterior.add(mesh);
  }
  driveRibbon(0,6.2,.044,driveMaterial);
  for(const edge of [-1,1])driveRibbon(edge*3.15,.19,.069,granite);
  const gravel=new THREE.MeshStandardMaterial({
    color:0xa0947f,roughness:1,side:THREE.DoubleSide
  });
  grain(gravel,32,.29);
  const ungenutzterBurgweg=scene.getObjectByName('Burgweg');

    const cloth=new THREE.PlaneGeometry(1,1,44,36);

  const chairFabric=new THREE.MeshStandardMaterial({color:0xd7bd77,roughness:.91});

  // Old procedurally boxed Cross Hall table + vase removed: replaced by real GLB assets above.
  resoluteDesk(0,-5.22);

  // Der NEUSTART enthält ausschließlich das Weiße Haus. Das vorherige Burgprojekt
  // bleibt unverändert in der separat archivierten Projekt-ZIP.
  const keys=new Set(),touchKeys=new Map();

    button.onpointerdown=event=>{
      event.preventDefault();

  }
  addEventListener('keydown',event=>{
    const key=event.key.toLowerCase();

  addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));
  addEventListener('blur',()=>{keys.clear();touchKeys.clear();});

  const cameraInput=renderer.domElement;
  let look=null,previousX=0,previousY=0;

    if(e.pointerId!==look)return;

  function valid(px,pz){
    if(Math.hypot(px,pz-fountainZ)<fountainRadius+.25)return false;
    if(Math.abs(px)>31||pz>51.5||pz< -7.8)return false;

    if(versperrtCrossHallV5(px,pz))return false;
    if(pz<8&&px>17.8)return false;
    if(pz<8&&px<-20.4)return false;
    if(pz<8&&px<-17.8&&(pz<2.86||pz>5.04))return false;
    if(ovalBoundary.some(point=>Math.hypot(px-point.x,pz-point.z)<.33))return false;
    if(obstacles.some(({x:cx,z:cz,w,d})=>Math.abs(px-cx)<w/2+.21&&Math.abs(pz-cz)<d/2+.21))return false;
    if(pz>12.75&&pz<17.75&&Math.abs(Math.abs(px)-7.7)<.42)return false;
    return bounds.every(([cx,cz])=>Math.hypot(px-cx,pz-cz)>.98);

  function ground(px,pz){

    if(Math.abs(px)>8.5||pz>20.55)return .03;

    figur.root.visible=drittePerson&&kameradistanz>.72;
    if(figur.root.visible){
      camera.position.set(x+rückX*kameradistanz,eye+kameradistanz*.23,z+rückZ*kameradistanz);

      camera.rotation.set(pitch,yaw,0,'YXZ');

    if(place.textContent!==roomName)place.textContent=roomName;
    sky.position.copy(camera.position);
    sky.material.uniforms.drift.value+=dt*.022;
    renderer.render(scene,camera);
  });
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
